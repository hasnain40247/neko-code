name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    name: Build & publish
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build all targets
        run: |
          mkdir -p dist
          BUILD_TARGET=bun-darwin-arm64 BUILD_OUTFILE=dist/neko-darwin-aarch64 bun run build.ts
          BUILD_TARGET=bun-darwin-x64   BUILD_OUTFILE=dist/neko-darwin-x86_64  bun run build.ts
          BUILD_TARGET=bun-linux-x64    BUILD_OUTFILE=dist/neko-linux-x86_64   bun run build.ts
          BUILD_TARGET=bun-linux-arm64  BUILD_OUTFILE=dist/neko-linux-aarch64  bun run build.ts

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" \
            --title "${{ github.ref_name }}" \
            --generate-notes \
            dist/neko-darwin-aarch64 \
            dist/neko-darwin-x86_64 \
            dist/neko-linux-x86_64 \
            dist/neko-linux-aarch64
