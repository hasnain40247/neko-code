name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    name: Build ${{ matrix.asset }}
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            target: bun-darwin-arm64
            asset: neko-darwin-aarch64
          - os: macos-14
            target: bun-darwin-x64
            asset: neko-darwin-x86_64
            extra_pkg: "@opentui/core-darwin-x64@0.3.4"
          - os: ubuntu-latest
            target: bun-linux-x64
            asset: neko-linux-x86_64
          - os: ubuntu-24.04-arm
            target: bun-linux-arm64
            asset: neko-linux-aarch64

    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Install cross-platform native package
        if: matrix.extra_pkg != ''
        run: npm install --force --no-save ${{ matrix.extra_pkg }}

      - name: Build
        run: |
          mkdir -p dist
          BUILD_TARGET=${{ matrix.target }} BUILD_OUTFILE=dist/${{ matrix.asset }} bun run build.ts

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: dist/${{ matrix.asset }}

  release:
    name: Publish release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" \
            --repo "${{ github.repository }}" \
            --title "${{ github.ref_name }}" \
            --generate-notes \
            dist/neko-darwin-aarch64 \
            dist/neko-darwin-x86_64 \
            dist/neko-linux-x86_64 \
            dist/neko-linux-aarch64
